name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Serve under /<repo>/ on GitHub project pages.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Outlet list: [{"name":"TS1","url":"https://script.google.com/macros/s/…/exec"}, …]
          # Generate it locally with `npm run outlets:secret`, then store it as a
          # repository SECRET named VITE_OUTLETS:
          # Settings ▸ Secrets and variables ▸ Actions ▸ Secrets ▸ New repository secret.
          # (Keeps the URLs out of the repo. They still end up in the built JS that
          # browsers download — unavoidable, since the browser has to call them.)
          VITE_OUTLETS: ${{ secrets.VITE_OUTLETS }}
          # Legacy single-backend fallback, used only if VITE_OUTLETS is empty.
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
